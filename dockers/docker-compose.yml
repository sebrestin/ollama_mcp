services:
  app:
    build:
      context: ..
      dockerfile: ./dockers/Dockerfile
    volumes:
      - ..:/workspaces/ollama_mcp:cached
      - ollama-data:/root/.ollama
    command: ollama serve
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    security_opt:
      - apparmor:unconfined
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0

volumes:
  ollama-data:
